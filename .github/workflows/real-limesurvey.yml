name: Real LimeSurvey integration

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify required secrets
        run: |
          test -n "$LS_INTEGRATION_URL"
          test -n "$LS_INTEGRATION_USERNAME"
          test -n "$LS_INTEGRATION_PASSWORD"
          test -n "$LS_INTEGRATION_SID"
          test -n "$ALLOWED_LIMESURVEY_HOSTS"
        env:
          LS_INTEGRATION_URL: ${{ secrets.LS_INTEGRATION_URL }}
          LS_INTEGRATION_USERNAME: ${{ secrets.LS_INTEGRATION_USERNAME }}
          LS_INTEGRATION_PASSWORD: ${{ secrets.LS_INTEGRATION_PASSWORD }}
          LS_INTEGRATION_SID: ${{ secrets.LS_INTEGRATION_SID }}
          ALLOWED_LIMESURVEY_HOSTS: ${{ secrets.ALLOWED_LIMESURVEY_HOSTS }}
      - name: Run real RemoteControl 2 tests
        run: pytest -q -m integration
        env:
          ENV: test
          FORM_BUILDER_SERVICE_JWT_SECRET: test-form-builder-secret-with-at-least-32-characters
          DICTIONARY_SERVICE_JWT_SECRET: test-dictionary-secret-with-at-least-32-characters
          LS_INTEGRATION_URL: ${{ secrets.LS_INTEGRATION_URL }}
          LS_INTEGRATION_USERNAME: ${{ secrets.LS_INTEGRATION_USERNAME }}
          LS_INTEGRATION_PASSWORD: ${{ secrets.LS_INTEGRATION_PASSWORD }}
          LS_INTEGRATION_SID: ${{ secrets.LS_INTEGRATION_SID }}
          ALLOWED_LIMESURVEY_HOSTS: ${{ secrets.ALLOWED_LIMESURVEY_HOSTS }}
