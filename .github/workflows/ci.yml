name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENV: test
      FORM_BUILDER_SERVICE_JWT_SECRET: test-form-builder-secret-with-at-least-32-characters
      DICTIONARY_SERVICE_JWT_SECRET: test-dictionary-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt pip-audit
      - run: pip-audit -r requirements-dev.txt
      - run: pytest -q -m "not integration"
      - run: python scripts/verify_compatibility.py > compatibility.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-compatibility
          path: compatibility.json
      - run: docker build -t limesurvey-rc2-api:test .
